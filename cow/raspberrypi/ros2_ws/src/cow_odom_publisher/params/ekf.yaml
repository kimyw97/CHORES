# @format

# config/ekf_filter_node.yaml
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1

    # 프레임 설정
    base_link_frame: base_footprint
    odom_frame: odom
    world_frame: map # map 대신 odom을 world 기준으로 사용
    publish_tf: true
    map_frame: map # 사용하지 않지만 필수 파라미터

    two_d_mode: true
    transform_time_offset: 0.0
    print_diagnostics: true
    use_control: false

    # -------------------------------
    # 오도메트리 센서 설정 (wheel encoder 기반)
    odom0: odom
    odom0_config: [
        true,
        true,
        false, # x, y, z
        false,
        false,
        true, # roll, pitch, yaw
        true,
        true,
        false, # vx, vy, vz
        false,
        false,
        true, # vroll, vpitch, vyaw
        false,
        false,
        false, # ax, ay, az
      ]
    odom0_differential: false
    odom0_relative: false

    # -------------------------------
    # IMU 센서 설정 (가속도계 + 자이로)
    imu0: imu/data
    imu0_config: [
        false,
        false,
        false, # x, y, z (IMU는 위치 제공 안함)
        true,
        true,
        true, # roll, pitch, yaw (자세를 추정에 사용)
        false,
        false,
        false, # vx, vy, vz
        true,
        true,
        true, # vroll, vpitch, vyaw (자이로 사용)
        true,
        true,
        true, # ax, ay, az (가속도 사용)
      ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
