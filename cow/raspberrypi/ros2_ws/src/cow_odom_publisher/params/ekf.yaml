# @format

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1

    # 프레임 설정
    base_link_frame: base_footprint
    odom_frame: odom
    world_frame: odom # odom 또는 map 중 TF 트리 기준 선택
    publish_tf: true
    map_frame: map # 필수 파라미터

    two_d_mode: true
    transform_time_offset: 0.0
    print_diagnostics: true
    use_control: false

    # ---------------------------------------
    # 오도메트리 센서 설정 (wheel encoder 기반)
    odom0: odom
    odom0_config:
      [
        true,
        true,
        false,
        false,
        false,
        true,
        true,
        false,
        false,
        false,
        false,
        true,
        false,
        false,
        false,
      ]
    odom0_differential: false
    odom0_relative: false

    # ---------------------------------------
    # # IMU 센서 설정 (가속도계 + 자이로 + 방향)
    # imu0: imu/data
    # imu0_config: [
    #     false,
    #     false,
    #     false, # orientation x, y, z
    #     false,
    #     false,
    #     false, # only yaw
    #     false,
    #     false,
    #     false, # linear velocity
    #     false,
    #     false,
    #     false, # angular velocity only yaw
    #   ]
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: false # STM32에서 중력 제거 안 했을 경우
